name: Build Z33 ECU Lab v0.2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK on runner
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run offline protocol parser tests
        run: bash tests/run_protocol_tests.sh
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v5
        with:
          name: Z33-ECU-Lab-v0.2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
